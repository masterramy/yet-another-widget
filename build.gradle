// Q1 modernization root build. Public identity remains historical until Q3.
buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.spring.io/libs-milestone' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Legacy Q1 dependencies SlimAdapter/providers-android were originally published here.
        // Replace them in Q2 rather than adding a third-party JCenter mirror.
        maven { url 'https://repo.spring.io/libs-milestone' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

name: Yet Another Widget Q2 Build

on:
  push:
    branches:
      - q2-publication-hardening-api36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Wallpaper preview permission compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          grep -Fq 'android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"' "$manifest"
          grep -Fq 'Build.VERSION.SDK_INT <= Build.VERSION_CODES.S_V2' "$settings"
          grep -Fq 'binding.actionShowWallpaper.visibility = if (wallpaperPreviewSupported) View.VISIBLE else View.GONE' "$settings"
          grep -Fq 'if (Build.VERSION.SDK_INT > Build.VERSION_CODES.S_V2)' "$settings"
          ! grep -Fq 'MANAGE_EXTERNAL_STORAGE' "$manifest"
          echo "Wallpaper preview is constrained to Android versions where legacy access remains valid."

      - name: Donation/Billing surface must be absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "com.android.billingclient|com.android.vending.BILLING|SupportDevActivity|SupportDevViewModel" \
            app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java; then
            echo "ERROR: retired Billing/SupportDev surface remains" >&2
            exit 1
          fi
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/settings/SupportDevActivity.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/viewmodels/settings/SupportDevViewModel.kt
          test ! -e app/src/main/res/layout/activity_support_dev.xml
          test ! -e app/src/main/res/layout/inapp_product_layout.xml
      - name: Google Fit and exact-alarm capability surface must be retired
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "play-services-fitness|play-services-auth" app/build.gradle; then
            echo "ERROR: retired Google Fit/Auth dependency remains" >&2
            exit 1
          fi
          if grep -R -E "ACTIVITY_RECOGNITION|com.google.android.apps.fitness|ActivityDetectionReceiver" app/src/main app/build.gradle; then
            echo "ERROR: retired Google Fit/activity-recognition surface remains" >&2
            exit 1
          fi
          if grep -R -E "com.google.android.gms.fitness|FitnessOptions|getHistoryClient|GoogleSignIn" app/src/main/java; then
            echo "ERROR: retired Google Fit/sign-in implementation remains" >&2
            exit 1
          fi
          if grep -R -E "ACTION_REQUEST_SCHEDULE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM" app/src/main app/build.gradle; then
            echo "ERROR: exact-alarm permission/request capability residue remains" >&2
            exit 1
          fi
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/receivers/ActivityDetectionReceiver.kt
      - name: Notification timeout scheduling must not require exact-alarm access
        shell: bash
        run: |
          set -euo pipefail
          notification=app/src/main/java/com/tommasoberlose/anotherwidget/receivers/NotificationListener.kt
          ! grep -Fq 'setExact(' "$notification"
          grep -Fq 'private const val NOTIFICATION_TIMEOUT_REQUEST_CODE = 28943' "$notification"
          grep -Fq 'NOTIFICATION_TIMEOUT_REQUEST_CODE,' "$notification"
          grep -Fq 'PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE' "$notification"
          grep -Fq 'cancel(timeoutIntent)' "$notification"
          grep -Fq 'set(' "$notification"
          grep -Fq 'timeoutIntent' "$notification"
          echo "Notification timeout uses one immutable inexact-alarm token without exact-alarm special access."
      - name: Next-alarm refresh scheduling must be Android 12+ safe
        shell: bash
        run: |
          set -euo pipefail
          alarm=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/AlarmHelper.kt
          grep -Fq 'PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE' "$alarm"
          grep -Fq 'cancel(operation)' "$alarm"
          grep -Fq 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && canScheduleExactAlarms()' "$alarm"
          grep -Fq 'setExact(AlarmManager.RTC, trigger, operation)' "$alarm"
          grep -Fq 'setAndAllowWhileIdle(AlarmManager.RTC, trigger, operation)' "$alarm"
          grep -Fq 'else -> set(AlarmManager.RTC, trigger, operation)' "$alarm"
          if grep -n -F 'PendingIntent.getBroadcast(context, ALARM_UPDATE_ID, intent, 0)' "$alarm"; then
            echo "ERROR: unsafe next-alarm PendingIntent flags returned" >&2
            exit 1
          fi
          echo "Next-alarm refresh uses immutable PendingIntent identity and exact-if-authorized fallback scheduling."
      - name: UI coroutine ownership and greeting PendingIntent contract
        shell: bash
        run: |
          set -euo pipefail
          color=app/src/main/java/com/tommasoberlose/anotherwidget/components/BottomSheetColorPicker.kt
          picker=app/src/main/java/com/tommasoberlose/anotherwidget/components/BottomSheetPicker.kt
          glance=app/src/main/java/com/tommasoberlose/anotherwidget/components/GlanceSettingsDialog.kt
          greetings=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/GreetingsHelper.kt
          widget_helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WidgetHelper.kt
          for source in "$color" "$picker" "$glance"; do
            ! grep -Fq 'GlobalScope' "$source"
            grep -Fq 'CoroutineScope(SupervisorJob() + Dispatchers.Main)' "$source"
            grep -Fq 'coroutineContext.cancelChildren()' "$source"
          done
          ! grep -Fq 'Dispatchers.Main.immediate' "$color"
          ! grep -Fq 'Dispatchers.Main.immediate' "$picker"
          ! grep -Fq 'Dispatchers.Main.immediate' "$glance"
          test "$(grep -c 'PendingIntent.getBroadcast(' "$greetings")" = "1"
          grep -Fq 'PendingIntent.FLAG_IMMUTABLE' "$greetings"
          grep -Fq 'cancel(pending(context, it))' "$greetings"
          grep -Fq 'hour >= 22 || hour < 5' "$greetings"
          ! grep -Fq 'hour >= 22 && hour < 5' "$greetings"
          ! grep -Fq 'HandlerThread' "$widget_helper"
          ! grep -Fq 'Looper.prepare()' "$widget_helper"
          grep -Fq 'Handler(Looper.getMainLooper())' "$widget_helper"
          grep -Fq 'context.applicationContext' "$widget_helper"
          echo "Dialog coroutines, greeting alarms, night greetings, and custom-font callback lifetime are hardened."
      - name: Event refresh scheduling must use relative millisecond durations
        shell: bash
        run: |
          set -euo pipefail
          updates=app/src/main/java/com/tommasoberlose/anotherwidget/receivers/UpdatesReceiver.kt
          grep -Fq 'private const val MINUTE_MILLIS = 60_000L' "$updates"
          grep -Fq 'private const val HALF_HOUR_MILLIS = 30 * MINUTE_MILLIS' "$updates"
          grep -Fq 'val remaining = event.startDate - now.timeInMillis' "$updates"
          grep -Fq 'if (remaining <= limit)' "$updates"
          grep -Fq 'if (diff.minutes > 30) -HALF_HOUR_MILLIS else HALF_HOUR_MILLIS' "$updates"
          ! grep -Fq 'if (event.startDate <= limit)' "$updates"
          ! grep -Fq 'if (diff.minutes > 30) (-30) else (+30)' "$updates"
          echo "Event refresh timing compares like units and updates at intended half-hour boundaries."
      - name: BroadcastReceiver background work must be durable
        shell: bash
        run: |
          set -euo pipefail
          receivers=app/src/main/java/com/tommasoberlose/anotherwidget/receivers
          worker=app/src/main/java/com/tommasoberlose/anotherwidget/services/UpdateWeatherWorker.kt
          if grep -R -n -F 'GlobalScope' "$receivers"; then
            echo "ERROR: BroadcastReceiver source must not launch unowned GlobalScope work" >&2
            exit 1
          fi
          test -f "$worker"
          grep -Fq 'class UpdateWeatherWorker' "$worker"
          grep -Fq ': CoroutineWorker(context, params)' "$worker"
          grep -Fq 'enqueueUniqueWork(' "$worker"
          grep -Fq '"updateWeather",' "$worker"
          grep -Fq 'ExistingWorkPolicy.KEEP,' "$worker"
          grep -Fq 'OneTimeWorkRequestBuilder<UpdateWeatherWorker>().build()' "$worker"
          grep -Fq 'UpdateWeatherWorker.enqueue(context)' "$receivers/WeatherReceiver.kt"
          grep -Fq 'UpdateWeatherWorker.enqueue(context)' "$receivers/UpdatesReceiver.kt"
          echo "BroadcastReceiver weather refresh is routed through durable WorkManager work."
      - name: Legacy provider and retired-font preferences must migrate durably
        shell: bash
        run: |
          set -euo pipefail
          app=app/src/main/java/com/tommasoberlose/anotherwidget/AWApplication.kt
          constants=app/src/main/java/com/tommasoberlose/anotherwidget/global/Constants.kt
          grep -Fq 'migrateLegacyPreferences()' "$app"
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.WEATHER_GOV.rawValue' "$app"
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.YR.rawValue' "$app"
          grep -Fq 'Preferences.weatherProvider = Constants.WeatherProvider.YR.rawValue' "$app"
          grep -Fq 'WEATHER_GOV.rawValue -> WEATHER_GOV' "$constants"
          grep -Fq 'YR(6)' "$constants"
          grep -Fq 'else -> YR' "$constants"
          for key in weatherProviderApiOpen weatherProviderApiWeatherBit weatherProviderApiWeatherApi weatherProviderApiHere weatherProviderApiAccuweather; do
            grep -Fq "Preferences.$key = \"\"" "$app"
          done
          grep -Fq 'if (Preferences.customFont == 1)' "$app"
          grep -Fq 'Preferences.customFont = Constants.CUSTOM_FONT_DEFAULT' "$app"
          echo "All retired weather-provider selections/keys and retired font preference normalize durably at startup."
      - name: External source links must use HTTPS and current project ownership
        shell: bash
        run: |
          set -euo pipefail
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          if grep -R -n -F 'http://' app/src/main/java --include='*.kt' --include='*.java'; then
            echo "ERROR: cleartext external link remains in app source" >&2
            exit 1
          fi
          grep -Fq 'https://www.weather.gov/' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          grep -Fq 'https://www.google.com/maps/search/?api=1&query=' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/IntentHelper.kt
          grep -Fq 'https://github.com/masterramy/yet-another-widget/blob/main/app/src/main/res/values/strings.xml' "$settings"
          grep -Fq 'https://github.com/masterramy/yet-another-widget/issues' "$settings"
          ! grep -Fq 'github.com/tommasoberlose/another-widget' "$settings"
          ! grep -Fq 'tommasoberlose.com' "$settings"
          grep -Fq 'binding.actionWebsite.visibility = View.GONE' "$settings"
          grep -Fq 'binding.actionPrivacyPolicy.visibility = View.GONE' "$settings"
          echo "External app links are HTTPS-only and no longer route users to inherited ownership surfaces."

      - name: Repository ownership surfaces must not impersonate the upstream project
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/FUNDING.yml
          ! grep -Fq 'assignees: tommasoberlose' .github/ISSUE_TEMPLATE/bug_report.md
          ! grep -Fq 'assignees: tommasoberlose' .github/ISSUE_TEMPLATE/feature_request.md
          ! grep -Fq 'paypal.me/tommasoberlose' README.md
          ! grep -Fq 'play.google.com/store/apps/details?id=com.tommasoberlose.anotherwidget' README.md
          ! grep -Fq 'tommaso.berlose@gmail.com' privacy-policy.md
          ! grep -Fq 'Firebase Crashlytics' privacy-policy.md
          grep -Fq 'independent, pre-release restoration' README.md
          grep -Fq 'original copyright and license terms remain preserved' README.md
          grep -Fq 'approximate (coarse) location only while an app Activity is visible' privacy-policy.md
          test -f docs/INTERACTIVE_WORKER_COORDINATION.md
          echo "Repository/public-support ownership is independent while MIT attribution remains preserved."
      - name: Historical network identity must be absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "api\.geonames\.org|tommaso\.berlose(@gmail\.com)?" app/src/main/java; then
            echo "ERROR: inherited network identity or GeoNames credential remains" >&2
            exit 1
          fi
      - name: Google Sans residue must be absent
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main -type f \( -iname '*google_sans*' -o -iname '*googlesans*' \) -print -quit | grep -q .; then
            echo "ERROR: retired Google Sans asset filename remains" >&2
            find app/src/main -type f \( -iname '*google_sans*' -o -iname '*googlesans*' \) -print >&2
            exit 1
          fi
          if grep -R -n -E "@font/google_sans|Google Sans|google_sans_|GoogleSans" app/src/main \
            --include='*.xml' --include='*.kt' --include='*.java' --include='*.gradle' \
            --include='*.properties' --include='*.json' --include='*.md'; then
            echo "ERROR: retired Google Sans text/source reference remains" >&2
            exit 1
          fi
          echo "Google Sans source residue absent."
      - name: Retired JobService paths must remain absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/services/BatteryListenerJob.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/services/EventListenerJob.kt
          ! grep -R -n -F 'JobService' app/src/main/java/com/tommasoberlose/anotherwidget             --include='*.kt' --include='*.java'
          echo "Retired legacy JobService paths are absent."
      - name: Retired location and GeoNames resource residue must stay absent
        shell: bash
        run: |
          set -euo pipefail
          strings=app/src/main/res/values/strings.xml
          for token in \
            background_location_warning \
            location_access_notification_channel_id \
            location_access_notification_channel_name \
            location_access_notification_channel_description \
            location_access_notification_title \
            location_access_notification_subtitle \
            geoname_credit; do
            if grep -R -n -F "$token" app/src/main --include='*.xml' --include='*.kt' --include='*.java'; then
              echo "ERROR: retired resource token remains: $token" >&2
              exit 1
            fi
          done
          ! grep -R -n -F 'http://www.geonames.org/' app/src/main
          echo "Retired location-service/background-location/GeoNames resource residue is absent."

      - name: Location access must remain coarse, foreground-only, and service-free
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          weather=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/tabs/WeatherFragment.kt
          chooser=app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/tabs/CustomLocationActivity.kt
          service=app/src/main/java/com/tommasoberlose/anotherwidget/services/LocationService.kt
          test "$(grep -c 'android.permission.ACCESS_COARSE_LOCATION' "$manifest")" = "1"
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' "$manifest"
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' "$manifest"
          ! grep -Fq 'android.permission.FOREGROUND_SERVICE' "$manifest"
          ! grep -Fq 'foregroundServiceType="location"' "$manifest"
          test ! -e "$service"
          ! grep -R -Fq 'Manifest.permission.ACCESS_FINE_LOCATION' app/src/main/java
          grep -Fq 'context is Activity && context.checkGrantedPermission(Manifest.permission.ACCESS_COARSE_LOCATION)' "$helper"
          grep -Fq 'LocationServices.getFusedLocationProviderClient(context)' "$helper"
          grep -Fq 'suspendCancellableCoroutine<android.location.Location?>' "$helper"
          grep -Fq 'if (!continuation.isActive) return@addOnCompleteListener' "$helper"
          grep -Fq 'continuation.resume(if (task.isSuccessful) task.result else null)' "$helper"
          grep -Fq 'Preferences.customLocationLat != "" && Preferences.customLocationLon != ""' "$helper"
          grep -Fq 'Manifest.permission.ACCESS_COARSE_LOCATION' "$weather"
          grep -Fq 'private var locationRefreshJob: Job? = null' "$weather"
          grep -Fq 'refreshDeviceLocationAndSchedule()' "$weather"
          grep -Fq 'WeatherHelper.updateWeather(requireContext())' "$weather"
          grep -Fq 'Manifest.permission.ACCESS_COARSE_LOCATION' "$chooser"
          grep -Fq 'Preferences.customLocationAdd = ""' "$chooser"
          ! grep -Fq 'LocationService' "$chooser"
          echo "Weather location access is coarse-only, visible-activity initiated, and service-free."
      - name: Local preference backup must be disabled
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          grep -Fq 'android:allowBackup="false"' "$manifest"
          ! grep -Fq 'android:allowBackup="true"' "$manifest"
          echo "Application backup disabled for local preference state."
      - name: Retired credentialed weather implementations must remain absent
        shell: bash
        run: |
          set -euo pipefail
          network=app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          services=app/src/main/java/com/tommasoberlose/anotherwidget/network/api/ApiServices.kt
          build=app/build.gradle
          for file in \
            app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/AccuweatherRepository.kt \
            app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/HereRepository.kt \
            app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherApiRepository.kt \
            app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherbitRepository.kt; do
            test ! -e "$file"
          done
          ! grep -Fq 'OpenWeatherMap-Android-Library' "$build"
          ! grep -Eq 'use(OpenWeatherMap|WeatherBitProvider|WeatherApiProvider|HereProvider|AccuweatherProvider)' "$network"
          ! grep -Eq 'OpenWeatherMapHelper|CurrentWeatherCallback|openweathermaplib' "$network"
          ! grep -Eq 'WeatherBitService|WeatherApiService|HereService|AccuweatherService' "$services"
          ! grep -Eq 'getWeatherBitIcon|getWeatherApiIcon|isKeyRequired|getApiKey' "$helper"
          ! grep -Eq 'OPEN_WEATHER|WEATHER_BIT|WEATHER_API|HERE|ACCUWEATHER' app/src/main/java/com/tommasoberlose/anotherwidget/global/Constants.kt
          echo "Retired credentialed weather provider implementations and dependency are absent."

      - name: Shipping weather providers must be account-free MET and NWS only
        shell: bash
        run: |
          set -euo pipefail
          constants=app/src/main/java/com/tommasoberlose/anotherwidget/global/Constants.kt
          application=app/src/main/java/com/tommasoberlose/anotherwidget/AWApplication.kt
          provider_ui=app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/tabs/WeatherProviderActivity.kt
          provider_layout=app/src/main/res/layout/activity_weather_provider.xml
          network=app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          privacy=privacy-policy.md
          grep -Fq 'WEATHER_GOV(5)' "$constants"
          grep -Fq 'YR(6)' "$constants"
          grep -Fq 'WEATHER_GOV.rawValue -> WEATHER_GOV' "$constants"
          grep -Fq 'else -> YR' "$constants"
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.WEATHER_GOV.rawValue' "$application"
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.YR.rawValue' "$application"
          for key in weatherProviderApiOpen weatherProviderApiWeatherBit weatherProviderApiWeatherApi weatherProviderApiHere weatherProviderApiAccuweather; do
            grep -Fq "Preferences.$key = \"\"" "$application"
          done
          grep -Fq 'listOf(' "$provider_ui"
          grep -Fq 'Constants.WeatherProvider.WEATHER_GOV' "$provider_ui"
          grep -Fq 'Constants.WeatherProvider.YR' "$provider_ui"
          ! grep -Fq '@string/weather_provider_activity_subtitle' "$provider_layout"
          grep -Fq 'if (Preferences.weatherTempUnit == "F")' "$network"
          grep -Fq '(temp * 9.0 / 5.0 + 32.0).toFloat()' "$network"
          ! grep -Fq 'Preferences.weatherTempUnit = "C"' "$network"
          grep -Fq 'supports MET Norway Locationforecast for global weather and the U.S. National Weather Service' "$privacy"
          ! grep -Fq 'user-supplied weather API keys' "$privacy"
          echo "Shipping weather selection is account-free MET/NWS only; retired choices migrate to MET."

      - name: MET and NWS transport, identification, and attribution contract
        shell: bash
        run: |
          set -euo pipefail
          gov=app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherGovRepository.kt
          yr=app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/YrRepository.kt
          api_services=app/src/main/java/com/tommasoberlose/anotherwidget/network/api/ApiServices.kt
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          strings=app/src/main/res/values/strings.xml
          grep -Fq 'private const val BASE_URL_GOV = "https://api.weather.gov/"' "$gov"
          grep -Fq 'private const val BASE_URL_YR = "https://api.met.no/weatherapi/locationforecast/2.0/"' "$yr"
          test "$(grep -c '@Headers("User-Agent: YetAnotherWidget/2.3.3 (https://github.com/masterramy/yet-another-widget)")' "$api_services")" = "3"
          grep -Fq '@GET("points/{latitude},{longitude}")' "$api_services"
          grep -Fq '@GET("gridpoints/{gridId}/{gridX},{gridY}/forecast")' "$api_services"
          grep -Fq '@GET("compact")' "$api_services"
          ! grep -Fq '@GET("compact.json")' "$api_services"
          grep -Fq 'Constants.WeatherProvider.WEATHER_GOV -> "https://www.weather.gov/"' "$helper"
          grep -Fq 'Constants.WeatherProvider.YR -> "https://api.met.no/weatherapi/locationforecast/2.0/documentation"' "$helper"
          ! grep -Fq 'Constants.WeatherProvider.YR -> "https://www.yr.no/"' "$helper"
          grep -Fq 'MET Norway\nLocationforecast' "$strings"
          ! grep -Fq 'YR.no/Met.no' "$strings"
          grep -Fq 'Weather data provided by MET Norway Locationforecast.' "$strings"
          echo "MET/NWS weather transport is HTTPS, identified, and attribution-safe."

      - name: Gson security and public-map contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.google.code.gson:gson:2.14.0'" app/build.gradle
          ! grep -Fq "com.google.code.gson:gson:2.8.6" app/build.gradle
          if grep -R -n -F 'com.google.gson.internal.LinkedTreeMap' app/src/main/java; then
            echo "ERROR: app still couples to Gson internal LinkedTreeMap" >&2
            exit 1
          fi
          if grep -R -n -F 'LinkedTreeMap<' app/src/main/java; then
            echo "ERROR: Gson internal map casts remain" >&2
            exit 1
          fi
          grep -Fq 'as Map<*, *>' app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          echo "Gson 2.14.0 security patch and public Map parsing contract present."
      - name: OkHttp security floor contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'" app/build.gradle
          ! grep -Fq "com.squareup.okhttp3:logging-interceptor:4.9.0" app/build.gradle
          echo "OkHttp logging interceptor is at the patched 4.9.2 floor."
      - name: Glide runtime/compiler versions must stay aligned
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.github.bumptech.glide:glide:4.12.0'" app/build.gradle
          grep -Fq "kapt 'com.github.bumptech.glide:compiler:4.12.0'" app/build.gradle
          ! grep -Fq "com.github.bumptech.glide:compiler:4.11.0" app/build.gradle
          echo "Glide runtime and annotation processor are aligned at 4.12.0."
      - name: SlimAdapter must remain vendored durable source
        shell: bash
        run: |
          set -euo pipefail
          slim_root=app/src/main/java/net/idik/lib/slimadapter
          test -d "$slim_root"
          test "$(find "$slim_root" -type f -name '*.java' | wc -l | tr -d ' ')" = "15"
          test ! -e "$slim_root/package-info.java"
          grep -Fq 'IViewInjector<net.idik.lib.slimadapter.viewinjector.DefaultViewInjector> injector' "$slim_root/SlimInjector.java"
          if grep -n -E 'curl|wget|raw\.githubusercontent\.com|github\.com/.*/SlimAdapter|SLIM_SRC_DIR|SLIM_SRC_ZIP' tools/q1_build.sh; then
            echo "ERROR: build-time SlimAdapter network/source injection returned" >&2
            exit 1
          fi
          grep -Fq 'SLIMADAPTER_COMMIT="3e00f876906019ac224e29159ff1a777c4a47d4b"' tools/q1_build.sh
          grep -Fq 'SlimAdapter' THIRD_PARTY_NOTICES.md
          grep -Fq '3e00f876906019ac224e29159ff1a777c4a47d4b' THIRD_PARTY_NOTICES.md
          echo "SlimAdapter is pinned, vendored, provenance-documented durable shipping source."
      - name: Widget PendingIntent compatibility must be durable source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/q1_widget_compat.py
          ! grep -Fq 'q1_widget_compat.py' tools/q1_build.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/StandardWidget.kt'),
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/AlignedWidget.kt'),
          ]
          refresh = re.compile(
              r'val\s+refreshIntent\s*=\s*PendingIntent\.getBroadcast\s*\(\s*'
              r'context\s*,\s*appWidgetId\s*,\s*'
              r'IntentHelper\.getWidgetUpdateIntent\s*\(\s*context\s*\)\s*,',
              re.MULTILINE,
          )
          for path in files:
              text = path.read_text()
              bad = re.findall(r'PendingIntent\.FLAG_UPDATE_CURRENT(?!\s+or\s+PendingIntent\.FLAG_IMMUTABLE)', text)
              if bad:
                  raise SystemExit(f'{path}: raw FLAG_UPDATE_CURRENT remains without FLAG_IMMUTABLE')
              if 'PendingIntent.getBroadcast(context, widgetID, i, 0)' in text:
                  raise SystemExit(f'{path}: legacy mutable weather token remains')
              if re.search(r'val\s+refreshIntent\s*=\s*PendingIntent\.getActivity\s*\(', text):
                  raise SystemExit(f'{path}: widget refresh still uses Activity PendingIntent')
              if len(refresh.findall(text)) != 1:
                  raise SystemExit(f'{path}: expected exactly one broadcast widget refresh token')
          print('Widget PendingIntent compatibility is durable shipping source; no build-time overlay remains.')
          PY
      - name: Q2 deterministic build
        shell: bash
        run: bash tools/q1_build.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: q2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

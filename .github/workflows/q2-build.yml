name: Yet Another Widget Q2 Build

on:
  push:
    branches:
      - q2-publication-hardening-api36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Wallpaper preview permission compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          grep -Fq 'android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"' "$manifest"
          grep -Fq 'Build.VERSION.SDK_INT <= Build.VERSION_CODES.S_V2' "$settings"
          grep -Fq 'binding.actionShowWallpaper.visibility = if (wallpaperPreviewSupported) View.VISIBLE else View.GONE' "$settings"
          grep -Fq 'if (Build.VERSION.SDK_INT > Build.VERSION_CODES.S_V2)' "$settings"
          ! grep -Fq 'MANAGE_EXTERNAL_STORAGE' "$manifest"
          echo "Wallpaper preview is constrained to Android versions where legacy access remains valid."

      - name: Donation/Billing surface must be absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "com.android.billingclient|com.android.vending.BILLING|SupportDevActivity|SupportDevViewModel" \
            app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java; then
            echo "ERROR: retired Billing/SupportDev surface remains" >&2
            exit 1
          fi
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/settings/SupportDevActivity.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/viewmodels/settings/SupportDevViewModel.kt
          test ! -e app/src/main/res/layout/activity_support_dev.xml
          test ! -e app/src/main/res/layout/inapp_product_layout.xml
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          settings_layout=app/src/main/res/layout/fragment_app_settings.xml
          ! grep -Fq 'binding.actionHelpDev' "$settings"
          ! grep -Fq 'binding.actionWebsite' "$settings"
          ! grep -Fq '@+id/action_help_dev' "$settings_layout"
          ! grep -Fq '@+id/action_website' "$settings_layout"
          for retired in \
            action_support \
            support_website_title \
            support_website_subtitle \
            support_main_subtitle \
            support_main_title \
            thanks \
            donation_coffee \
            donation_donuts \
            donation_dinner \
            donation_breakfast \
            donation_lunch \
            support_dev_subtitle; do
            if grep -R -n -F "name=\"$retired\"" app/src/main/res/values* --include='strings.xml'; then
              echo "ERROR: retired donation/developer resource remains: $retired" >&2
              exit 1
            fi
          done
          echo "Retired Billing, donation, and inherited developer-support surfaces are absent."
      - name: Retired integrations shell must be absent
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          settings_layout=app/src/main/res/layout/fragment_app_settings.xml
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/settings/IntegrationsActivity.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/viewmodels/settings/IntegrationsViewModel.kt
          test ! -e app/src/main/res/layout/activity_integrations.xml
          ! grep -Fq '.ui.activities.settings.IntegrationsActivity' "$manifest"
          ! grep -Fq 'binding.actionIntegrations' "$settings"
          ! grep -Fq '@+id/action_integrations' "$settings_layout"
          if grep -R -n -E 'installedIntegrations|settings_title_integrations|label_count_installed_integrations' app/src/main; then
            echo "ERROR: retired integrations shell residue remains" >&2
            exit 1
          fi
          echo "Retired empty integrations shell is absent."
      - name: Google Fit and exact-alarm capability surface must be retired
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "play-services-fitness|play-services-auth" app/build.gradle; then
            echo "ERROR: retired Google Fit/Auth dependency remains" >&2
            exit 1
          fi
          if grep -R -E "ACTIVITY_RECOGNITION|com.google.android.apps.fitness|ActivityDetectionReceiver" app/src/main app/build.gradle; then
            echo "ERROR: retired Google Fit/activity-recognition surface remains" >&2
            exit 1
          fi
          if grep -R -E "com.google.android.gms.fitness|FitnessOptions|getHistoryClient|GoogleSignIn" app/src/main/java; then
            echo "ERROR: retired Google Fit/sign-in implementation remains" >&2
            exit 1
          fi
          if grep -R -E "GOOGLE_FIT_STEPS|showDailySteps|googleFitSteps|getFitIntent|daily_steps_counter|settings_daily_steps_|settings_request_fitness_access|google_fit_account_|name=\"google_fit\"" app/src/main; then
            echo "ERROR: retired Google Fit rendering/preference/resource residue remains" >&2
            exit 1
          fi
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/receivers/CrashlyticsReceiver.kt
          ! grep -R -n -F 'CrashlyticsReceiver' app/src/main/java
          grep -Fq 'object RuntimeLog' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/RuntimeLog.kt
          grep -Fq 'Log.e(BuildConfig.APPLICATION_ID' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/RuntimeLog.kt
          if grep -R -E "ACTION_REQUEST_SCHEDULE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM" app/src/main app/build.gradle; then
            echo "ERROR: exact-alarm permission/request capability residue remains" >&2
            exit 1
          fi
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/receivers/ActivityDetectionReceiver.kt
      - name: Notification timeout scheduling must not require exact-alarm access
        shell: bash
        run: |
          set -euo pipefail
          notification=app/src/main/java/com/tommasoberlose/anotherwidget/receivers/NotificationListener.kt
          ! grep -Fq 'setExact(' "$notification"
          grep -Fq 'private const val NOTIFICATION_TIMEOUT_REQUEST_CODE = 28943' "$notification"
          grep -Fq 'NOTIFICATION_TIMEOUT_REQUEST_CODE,' "$notification"
          grep -Fq 'PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE' "$notification"
          grep -Fq 'cancel(timeoutIntent)' "$notification"
          grep -Fq 'set(' "$notification"
          grep -Fq 'timeoutIntent' "$notification"
          echo "Notification timeout uses one immutable inexact-alarm token without exact-alarm special access."
      - name: Next-alarm refresh scheduling must be Android 12+ safe
        shell: bash
        run: |
          set -euo pipefail
          alarm=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/AlarmHelper.kt
          grep -Fq 'PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE' "$alarm"
          grep -Fq 'cancel(operation)' "$alarm"
          grep -Fq 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && canScheduleExactAlarms()' "$alarm"
          grep -Fq 'setExact(AlarmManager.RTC, trigger, operation)' "$alarm"
          grep -Fq 'setAndAllowWhileIdle(AlarmManager.RTC, trigger, operation)' "$alarm"
          grep -Fq 'else -> set(AlarmManager.RTC, trigger, operation)' "$alarm"
          if grep -n -F 'PendingIntent.getBroadcast(context, ALARM_UPDATE_ID, intent, 0)' "$alarm"; then
            echo "ERROR: unsafe next-alarm PendingIntent flags returned" >&2
            exit 1
          fi
          echo "Next-alarm refresh uses immutable PendingIntent identity and exact-if-authorized fallback scheduling."
      - name: UI coroutine ownership and greeting PendingIntent contract
        shell: bash
        run: |
          set -euo pipefail
          color=app/src/main/java/com/tommasoberlose/anotherwidget/components/BottomSheetColorPicker.kt
          picker=app/src/main/java/com/tommasoberlose/anotherwidget/components/BottomSheetPicker.kt
          glance=app/src/main/java/com/tommasoberlose/anotherwidget/components/GlanceSettingsDialog.kt
          greetings=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/GreetingsHelper.kt
          widget_helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WidgetHelper.kt
          for source in "$color" "$picker" "$glance"; do
            ! grep -Fq 'GlobalScope' "$source"
            grep -Fq 'CoroutineScope(SupervisorJob() + Dispatchers.Main)' "$source"
            grep -Fq 'coroutineContext.cancelChildren()' "$source"
          done
          ! grep -Fq 'Dispatchers.Main.immediate' "$color"
          ! grep -Fq 'Dispatchers.Main.immediate' "$picker"
          ! grep -Fq 'Dispatchers.Main.immediate' "$glance"
          test "$(grep -c 'PendingIntent.getBroadcast(' "$greetings")" = "1"
          grep -Fq 'PendingIntent.FLAG_IMMUTABLE' "$greetings"
          grep -Fq 'cancel(pending(context, it))' "$greetings"
          grep -Fq 'hour >= 22 || hour < 5' "$greetings"
          ! grep -Fq 'hour >= 22 && hour < 5' "$greetings"
          ! grep -Fq 'HandlerThread' "$widget_helper"
          ! grep -Fq 'Looper.prepare()' "$widget_helper"
          grep -Fq 'Handler(Looper.getMainLooper())' "$widget_helper"
          grep -Fq 'context.applicationContext' "$widget_helper"
          echo "Dialog coroutines, greeting alarms, night greetings, and custom-font callback lifetime are hardened."
      - name: Event refresh scheduling must use relative millisecond durations
        shell: bash
        run: |
          set -euo pipefail
          updates=app/src/main/java/com/tommasoberlose/anotherwidget/receivers/UpdatesReceiver.kt
          grep -Fq 'private const val MINUTE_MILLIS = 60_000L' "$updates"
          grep -Fq 'private const val HALF_HOUR_MILLIS = 30 * MINUTE_MILLIS' "$updates"
          grep -Fq 'val remaining = event.startDate - now.timeInMillis' "$updates"
          grep -Fq 'if (remaining <= limit)' "$updates"
          grep -Fq 'if (diff.minutes > 30) -HALF_HOUR_MILLIS else HALF_HOUR_MILLIS' "$updates"
          ! grep -Fq 'if (event.startDate <= limit)' "$updates"
          ! grep -Fq 'if (diff.minutes > 30) (-30) else (+30)' "$updates"
          echo "Event refresh timing compares like units and updates at intended half-hour boundaries."
      - name: BroadcastReceiver background work must be durable
        shell: bash
        run: |
          set -euo pipefail
          receivers=app/src/main/java/com/tommasoberlose/anotherwidget/receivers
          worker=app/src/main/java/com/tommasoberlose/anotherwidget/services/UpdateWeatherWorker.kt
          if grep -R -n -F 'GlobalScope' "$receivers"; then
            echo "ERROR: BroadcastReceiver source must not launch unowned GlobalScope work" >&2
            exit 1
          fi
          test -f "$worker"
          grep -Fq 'class UpdateWeatherWorker' "$worker"
          grep -Fq ': CoroutineWorker(context, params)' "$worker"
          grep -Fq 'enqueueUniqueWork(' "$worker"
          grep -Fq '"updateWeather",' "$worker"
          grep -Fq 'ExistingWorkPolicy.KEEP,' "$worker"
          grep -Fq 'OneTimeWorkRequestBuilder<UpdateWeatherWorker>().build()' "$worker"
          grep -Fq 'UpdateWeatherWorker.enqueue(context)' "$receivers/WeatherReceiver.kt"
          grep -Fq 'UpdateWeatherWorker.enqueue(context)' "$receivers/UpdatesReceiver.kt"
          echo "BroadcastReceiver weather refresh is routed through durable WorkManager work."
      - name: Legacy provider and retired-font preferences must migrate durably
        shell: bash
        run: |
          set -euo pipefail
          app=app/src/main/java/com/tommasoberlose/anotherwidget/AWApplication.kt
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.WEATHER_API.rawValue' "$app"
          grep -Fq 'Preferences.weatherProvider != Constants.WeatherProvider.WEATHER_GOV.rawValue' "$app"
          grep -Fq 'Preferences.weatherProvider = Constants.WeatherProvider.WEATHER_API.rawValue' "$app"
          ! grep -Fq 'Preferences.weatherProviderApiWeatherApi = ""' "$app"
          for key in weatherProviderApiOpen weatherProviderApiWeatherBit weatherProviderApiHere weatherProviderApiAccuweather; do
            grep -Fq "Preferences.$key = \"\"" "$app"
          done
          grep -Fq 'if (Preferences.customFont == 1)' "$app"
          grep -Fq 'Preferences.customFont = Constants.CUSTOM_FONT_DEFAULT' "$app"
          echo "Retired provider selections/credentials normalize to WeatherAPI while preserving an existing WeatherAPI key."
      - name: New remote-font acquisition surface must be absent
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          constants=app/src/main/java/com/tommasoberlose/anotherwidget/global/Constants.kt
          requests=app/src/main/java/com/tommasoberlose/anotherwidget/global/RequestCode.kt
          typography=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/tabs/TypographyFragment.kt
          widget=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WidgetHelper.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/tabs/CustomFontActivity.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/viewmodels/tabs/CustomFontViewModel.kt
          test ! -e app/src/main/res/layout/activity_custom_font.xml
          ! grep -Fq '.ui.activities.tabs.CustomFontActivity' "$manifest"
          ! grep -Fq 'CUSTOM_FONT_DOWNLOAD_NEW' "$constants"
          ! grep -Fq 'CUSTOM_FONT_CHOOSER_REQUEST_CODE' "$requests"
          ! grep -Fq 'CustomFontActivity' "$typography"
          if grep -R -n -F 'action_custom_font_to_search' app/src/main/res/values* --include='strings.xml'; then
            echo "ERROR: retired new-font acquisition resource remains" >&2
            exit 1
          fi
          grep -Fq 'const val CUSTOM_FONT_DOWNLOADED = 2' "$constants"
          grep -Fq 'if (Preferences.customFontFile != "")' "$widget"
          grep -Fq 'FontRequest(' "$widget"
          echo "New remote-font acquisition is absent while legacy downloaded-font compatibility remains."
      - name: External source links must use HTTPS and current project ownership
        shell: bash
        run: |
          set -euo pipefail
          settings=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/SettingsFragment.kt
          if grep -R -n -F 'http://' app/src/main/java --include='*.kt' --include='*.java'; then
            echo "ERROR: cleartext external link remains in app source" >&2
            exit 1
          fi
          grep -Fq 'https://www.weather.gov/' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          grep -Fq 'https://www.weatherapi.com/' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          grep -Fq 'https://www.google.com/maps/search/?api=1&query=' app/src/main/java/com/tommasoberlose/anotherwidget/helpers/IntentHelper.kt
          grep -Fq 'https://github.com/masterramy/yet-another-widget/blob/main/app/src/main/res/values/strings.xml' "$settings"
          grep -Fq 'https://github.com/masterramy/yet-another-widget/issues' "$settings"
          ! grep -Fq 'github.com/tommasoberlose/another-widget' "$settings"
          ! grep -Fq 'tommasoberlose.com' "$settings"
          ! grep -Fq 'binding.actionWebsite' "$settings"
          grep -Fq 'binding.actionPrivacyPolicy.visibility = View.GONE' "$settings"
          echo "External app links are HTTPS-only and no longer route users to inherited ownership surfaces."

      - name: Repository ownership surfaces must not impersonate the upstream project
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/FUNDING.yml
          ! grep -Fq 'assignees: tommasoberlose' .github/ISSUE_TEMPLATE/bug_report.md
          ! grep -Fq 'assignees: tommasoberlose' .github/ISSUE_TEMPLATE/feature_request.md
          ! grep -Fq 'paypal.me/tommasoberlose' README.md
          ! grep -Fq 'play.google.com/store/apps/details?id=com.tommasoberlose.anotherwidget' README.md
          ! grep -Fq 'tommaso.berlose@gmail.com' privacy-policy.md
          ! grep -Fq 'Firebase Crashlytics' privacy-policy.md
          grep -Fq 'independent, pre-release restoration' README.md
          grep -Fq 'original copyright and license terms remain preserved' README.md
          grep -Fq 'approximate (coarse) location only while an app Activity is visible' privacy-policy.md
          test -f docs/INTERACTIVE_WORKER_COORDINATION.md
          echo "Repository/public-support ownership is independent while MIT attribution remains preserved."
      - name: Historical network identity must be absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "api\.geonames\.org|tommaso\.berlose(@gmail\.com)?" app/src/main/java; then
            echo "ERROR: inherited network identity or GeoNames credential remains" >&2
            exit 1
          fi
      - name: Google Sans residue must be absent
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main -type f \( -iname '*google_sans*' -o -iname '*googlesans*' \) -print -quit | grep -q .; then
            echo "ERROR: retired Google Sans asset filename remains" >&2
            find app/src/main -type f \( -iname '*google_sans*' -o -iname '*googlesans*' \) -print >&2
            exit 1
          fi
          if grep -R -n -E "@font/google_sans|Google Sans|google_sans_|GoogleSans" app/src/main \
            --include='*.xml' --include='*.kt' --include='*.java' --include='*.gradle' \
            --include='*.properties' --include='*.json' --include='*.md'; then
            echo "ERROR: retired Google Sans text/source reference remains" >&2
            exit 1
          fi
          echo "Google Sans source residue absent."
      - name: Retired JobService paths must remain absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/services/BatteryListenerJob.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/services/EventListenerJob.kt
          ! grep -R -n -F 'JobService' app/src/main/java/com/tommasoberlose/anotherwidget             --include='*.kt' --include='*.java'
          echo "Retired legacy JobService paths are absent."
      - name: Retired location and GeoNames resource residue must stay absent
        shell: bash
        run: |
          set -euo pipefail
          strings=app/src/main/res/values/strings.xml
          for token in \
            background_location_warning \
            location_access_notification_channel_id \
            location_access_notification_channel_name \
            location_access_notification_channel_description \
            location_access_notification_title \
            location_access_notification_subtitle \
            geoname_credit; do
            if grep -R -n -F "$token" app/src/main --include='*.xml' --include='*.kt' --include='*.java'; then
              echo "ERROR: retired resource token remains: $token" >&2
              exit 1
            fi
          done
          ! grep -R -n -F 'http://www.geonames.org/' app/src/main
          echo "Retired location-service/background-location/GeoNames resource residue is absent."

      - name: Location access must remain coarse, foreground-only, and service-free
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          weather=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/tabs/WeatherFragment.kt
          chooser=app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/tabs/CustomLocationActivity.kt
          service=app/src/main/java/com/tommasoberlose/anotherwidget/services/LocationService.kt
          test "$(grep -c 'android.permission.ACCESS_COARSE_LOCATION' "$manifest")" = "1"
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' "$manifest"
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' "$manifest"
          ! grep -Fq 'android.permission.FOREGROUND_SERVICE' "$manifest"
          ! grep -Fq 'foregroundServiceType="location"' "$manifest"
          test ! -e "$service"
          ! grep -R -Fq 'Manifest.permission.ACCESS_FINE_LOCATION' app/src/main/java
          grep -Fq 'context is Activity && context.checkGrantedPermission(Manifest.permission.ACCESS_COARSE_LOCATION)' "$helper"
          grep -Fq 'LocationServices.getFusedLocationProviderClient(context)' "$helper"
          grep -Fq 'suspendCancellableCoroutine<android.location.Location?>' "$helper"
          grep -Fq 'if (!continuation.isActive) return@addOnCompleteListener' "$helper"
          grep -Fq 'continuation.resume(if (task.isSuccessful) task.result else null)' "$helper"
          grep -Fq 'Preferences.customLocationLat != "" && Preferences.customLocationLon != ""' "$helper"
          grep -Fq 'Manifest.permission.ACCESS_COARSE_LOCATION' "$weather"
          grep -Fq 'private var locationRefreshJob: Job? = null' "$weather"
          grep -Fq 'refreshDeviceLocationAndSchedule()' "$weather"
          grep -Fq 'WeatherHelper.updateWeather(requireContext())' "$weather"
          grep -Fq 'Manifest.permission.ACCESS_COARSE_LOCATION' "$chooser"
          grep -Fq 'Preferences.customLocationAdd = ""' "$chooser"
          ! grep -Fq 'LocationService' "$chooser"
          echo "Weather location access is coarse-only, visible-activity initiated, and service-free."
      - name: Local preference backup must be disabled
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          grep -Fq 'android:allowBackup="false"' "$manifest"
          ! grep -Fq 'android:allowBackup="true"' "$manifest"
          echo "Application backup disabled for local preference state."
      - name: WeatherAPI release surface must remain attribution-safe and key-safe
        shell: bash
        run: |
          set -euo pipefail
          key_layout=app/src/main/res/layout/weather_provider_settings_layout.xml
          provider_ui=app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/tabs/WeatherProviderActivity.kt
          standard_layout=app/src/main/res/layout/the_widget.xml
          aligned_layout=app/src/main/res/layout/left_aligned_widget.xml
          standard=app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/StandardWidget.kt
          aligned=app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/AlignedWidget.kt
          strings=app/src/main/res/values/strings.xml

          ! grep -Fq 'android:inputType="textCapWords"' "$key_layout"
          grep -Fq 'app:endIconMode="password_toggle"' "$key_layout"
          grep -Fq 'android:inputType="textPassword"' "$key_layout"
          grep -Fq 'android:importantForAutofill="no"' "$key_layout"
          grep -Fq 'android:textDirection="ltr"' "$key_layout"

          test "$(grep -c 'selectProvider(provider)' "$provider_ui")" = "2"
          grep -Fq 'WeatherHelper.removeWeather(this)' "$provider_ui"
          grep -Fq 'Preferences.weatherProvider = provider.rawValue' "$provider_ui"

          grep -Fq '<string name="weatherapi_widget_credit" translatable="false"> · WeatherAPI.com</string>' "$strings"
          test "$(grep -c 'android:id="@+id/weather_date_line_credit"' "$standard_layout")" = "1"
          test "$(grep -c 'android:id="@+id/weather_sub_line_credit"' "$standard_layout")" = "1"
          test "$(grep -c 'android:id="@+id/weather_date_line_credit"' "$aligned_layout")" = "1"
          test "$(grep -c 'android:id="@+id/weather_sub_line_credit"' "$aligned_layout")" = "1"
          for renderer in "$standard" "$aligned"; do
            grep -Fq 'Constants.WeatherProvider.fromInt(Preferences.weatherProvider) == Constants.WeatherProvider.WEATHER_API' "$renderer"
            grep -Fq 'bindingView.weatherDateLineCredit.isVisible = showWeatherApiCredit' "$renderer"
            grep -Fq 'bindingView.weatherSubLineCredit.isVisible = showWeatherApiCredit' "$renderer"
          done

          for retired in \
            settings_weather_provider_open_weather \
            settings_weather_provider_weatherbit \
            settings_weather_provider_here \
            settings_weather_provider_accuweather \
            settings_weather_provider_yr \
            weather_provider_info_open_weather_title \
            weather_provider_info_weatherbit_title \
            weather_provider_info_here_title \
            weather_provider_info_accuweather_title \
            weather_provider_info_yr_title \
            weather_provider_info_open_weather_subtitle \
            weather_provider_info_weatherbit_subtitle \
            weather_provider_info_here_subtitle \
            weather_provider_info_accuweather_subtitle \
            weather_provider_info_yr_subtitle \
            celsius_only_message \
            api_key_hint \
            weather_warning \
            weather_provider_activity_subtitle \
            api_key_required_message \
            weather_select_a_provider; do
            if grep -R -n -F "name=\"$retired\"" app/src/main/res/values* --include='strings.xml'; then
              echo "ERROR: retired weather-provider resource remains: $retired" >&2
              exit 1
            fi
          done
          echo "WeatherAPI key entry, provider switching, rendered attribution, and retired-provider resources are release-safe."

      - name: WeatherAPI current-condition cache must expire within 60 minutes
        shell: bash
        run: |
          set -euo pipefail
          prefs=app/src/main/java/com/tommasoberlose/anotherwidget/global/Preferences.kt
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          network=app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          receiver=app/src/main/java/com/tommasoberlose/anotherwidget/receivers/WeatherReceiver.kt
          fragment=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/tabs/WeatherFragment.kt
          standard=app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/StandardWidget.kt
          aligned=app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/AlignedWidget.kt
          grep -Fq 'var weatherUpdatedAt by longPref(key = "PREF_WEATHER_UPDATED_AT", default = 0L)' "$prefs"
          grep -Fq 'private const val WEATHER_API_MAX_CACHE_AGE_MILLIS = 60 * 60 * 1000L' "$helper"
          grep -Fq 'age >= WEATHER_API_MAX_CACHE_AGE_MILLIS' "$helper"
          grep -Fq 'age < 0L' "$helper"
          grep -Fq 'Preferences.weatherUpdatedAt = 0L' "$helper"
          test "$(grep -c 'Preferences.weatherUpdatedAt = System.currentTimeMillis()' "$network")" = "2"
          grep -Fq 'Preferences.weatherRefreshPeriod.coerceAtMost(1)' "$receiver"
          grep -Fq 'Preferences.weatherRefreshPeriod = 1' "$fragment"
          grep -Fq '== Constants.WeatherProvider.WEATHER_API) 1 else 5' "$fragment"
          test "$(grep -c 'WeatherHelper.hasDisplayableWeather()' "$standard")" = "2"
          test "$(grep -c 'WeatherHelper.hasDisplayableWeather()' "$aligned")" = "2"
          echo "WeatherAPI current conditions cannot be scheduled or rendered as cached data beyond 60 minutes."

      - name: Shipping weather architecture must be NWS plus user-key WeatherAPI
        shell: bash
        run: |
          set -euo pipefail
          constants=app/src/main/java/com/tommasoberlose/anotherwidget/global/Constants.kt
          prefs=app/src/main/java/com/tommasoberlose/anotherwidget/global/Preferences.kt
          app=app/src/main/java/com/tommasoberlose/anotherwidget/AWApplication.kt
          network=app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          services=app/src/main/java/com/tommasoberlose/anotherwidget/network/api/ApiServices.kt
          helper=app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt
          sheet=app/src/main/java/com/tommasoberlose/anotherwidget/components/BottomSheetWeatherProviderSettings.kt
          weather_ui=app/src/main/java/com/tommasoberlose/anotherwidget/ui/fragments/tabs/WeatherFragment.kt
          strings=app/src/main/res/values/strings.xml
          privacy=privacy-policy.md
          weatherapi_repo=app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherApiRepository.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/YrRepository.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherbitRepository.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/HereRepository.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/AccuweatherRepository.kt
          grep -Fq 'WEATHER_API(2)' "$constants"
          grep -Fq 'WEATHER_GOV(5)' "$constants"
          ! grep -Eq 'OPEN_WEATHER|WEATHER_BIT|HERE|ACCUWEATHER|YR' "$constants"
          grep -Fq 'isUnitedStates()' "$prefs"
          grep -Fq 'Preferences.weatherProviderApiWeatherApi' "$sheet"
          grep -Fq 'Constants.WeatherProvider.WEATHER_API -> useWeatherApiProvider(context)' "$network"
          grep -Fq 'interface WeatherApiService' "$services"
          grep -Fq '@GET("current.json")' "$services"
          grep -Fq 'private const val BASE_URL_API = "https://api.weatherapi.com/v1/"' "$weatherapi_repo"
          grep -Fq 'Weather data by WeatherAPI.com' "$strings"
          grep -Fq 'safety-critical decisions' "$strings"
          grep -Fq 'binding.weatherApiComplianceNotice.isVisible' "$weather_ui"
          grep -Fq 'The app does not ship or share a common WeatherAPI.com key.' "$privacy"
          echo "Shipping weather is NWS plus globally available user-key WeatherAPI with persistent attribution/disclaimer."

      - name: NWS transport must remain HTTPS and build-identity identified
        shell: bash
        run: |
          set -euo pipefail
          gov=app/src/main/java/com/tommasoberlose/anotherwidget/network/repository/WeatherGovRepository.kt
          services=app/src/main/java/com/tommasoberlose/anotherwidget/network/api/ApiServices.kt
          grep -Fq 'private const val BASE_URL_GOV = "https://api.weather.gov/"' "$gov"
          grep -Fq '"${BuildConfig.APPLICATION_ID}/${BuildConfig.VERSION_NAME} (https://github.com/masterramy/yet-another-widget)"' "$gov"
          test "$(grep -c '@Header("User-Agent") userAgent: String' "$services")" = "2"
          ! grep -Fq 'YetAnotherWidget/2.3.3' "$services"
          ! grep -Fq 'YetAnotherWidget/2.3.3' "$gov"
          grep -Fq 'apiServiceGov.getGridPoints(userAgent, latitude, longitude)' "$gov"
          grep -Fq 'apiServiceGov.getWeather(userAgent, gridId, gridX.toInt(), gridY.toInt(), unit)' "$gov"
          grep -Fq '@GET("points/{latitude},{longitude}")' "$services"
          grep -Fq '@GET("gridpoints/{gridId}/{gridX},{gridY}/forecast")' "$services"
          echo "NWS transport remains HTTPS and identifies the final build package/version dynamically."

      - name: Gson security and public-map contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.google.code.gson:gson:2.14.0'" app/build.gradle
          ! grep -Fq "com.google.code.gson:gson:2.8.6" app/build.gradle
          if grep -R -n -F 'com.google.gson.internal.LinkedTreeMap' app/src/main/java; then
            echo "ERROR: app still couples to Gson internal LinkedTreeMap" >&2
            exit 1
          fi
          if grep -R -n -F 'LinkedTreeMap<' app/src/main/java; then
            echo "ERROR: Gson internal map casts remain" >&2
            exit 1
          fi
          grep -Fq 'as Map<*, *>' app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          echo "Gson 2.14.0 security patch and public Map parsing contract present."
      - name: OkHttp security floor contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'" app/build.gradle
          ! grep -Fq "com.squareup.okhttp3:logging-interceptor:4.9.0" app/build.gradle
          echo "OkHttp logging interceptor is at the patched 4.9.2 floor."
      - name: Glide runtime/compiler versions must stay aligned
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.github.bumptech.glide:glide:4.12.0'" app/build.gradle
          grep -Fq "kapt 'com.github.bumptech.glide:compiler:4.12.0'" app/build.gradle
          ! grep -Fq "com.github.bumptech.glide:compiler:4.11.0" app/build.gradle
          echo "Glide runtime and annotation processor are aligned at 4.12.0."
      - name: SlimAdapter must remain vendored durable source
        shell: bash
        run: |
          set -euo pipefail
          slim_root=app/src/main/java/net/idik/lib/slimadapter
          test -d "$slim_root"
          test "$(find "$slim_root" -type f -name '*.java' | wc -l | tr -d ' ')" = "15"
          test ! -e "$slim_root/package-info.java"
          grep -Fq 'IViewInjector<net.idik.lib.slimadapter.viewinjector.DefaultViewInjector> injector' "$slim_root/SlimInjector.java"
          if grep -n -E 'curl|wget|raw\.githubusercontent\.com|github\.com/.*/SlimAdapter|SLIM_SRC_DIR|SLIM_SRC_ZIP' tools/q1_build.sh; then
            echo "ERROR: build-time SlimAdapter network/source injection returned" >&2
            exit 1
          fi
          grep -Fq 'SLIMADAPTER_COMMIT="3e00f876906019ac224e29159ff1a777c4a47d4b"' tools/q1_build.sh
          grep -Fq 'SlimAdapter' THIRD_PARTY_NOTICES.md
          grep -Fq '3e00f876906019ac224e29159ff1a777c4a47d4b' THIRD_PARTY_NOTICES.md
          echo "SlimAdapter is pinned, vendored, provenance-documented durable shipping source."
      - name: Widget PendingIntent compatibility must be durable source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/q1_widget_compat.py
          ! grep -Fq 'q1_widget_compat.py' tools/q1_build.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/StandardWidget.kt'),
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/AlignedWidget.kt'),
          ]
          refresh = re.compile(
              r'val\s+refreshIntent\s*=\s*PendingIntent\.getBroadcast\s*\(\s*'
              r'context\s*,\s*appWidgetId\s*,\s*'
              r'IntentHelper\.getWidgetUpdateIntent\s*\(\s*context\s*\)\s*,',
              re.MULTILINE,
          )
          for path in files:
              text = path.read_text()
              bad = re.findall(r'PendingIntent\.FLAG_UPDATE_CURRENT(?!\s+or\s+PendingIntent\.FLAG_IMMUTABLE)', text)
              if bad:
                  raise SystemExit(f'{path}: raw FLAG_UPDATE_CURRENT remains without FLAG_IMMUTABLE')
              if 'PendingIntent.getBroadcast(context, widgetID, i, 0)' in text:
                  raise SystemExit(f'{path}: legacy mutable weather token remains')
              if re.search(r'val\s+refreshIntent\s*=\s*PendingIntent\.getActivity\s*\(', text):
                  raise SystemExit(f'{path}: widget refresh still uses Activity PendingIntent')
              if len(refresh.findall(text)) != 1:
                  raise SystemExit(f'{path}: expected exactly one broadcast widget refresh token')
          print('Widget PendingIntent compatibility is durable shipping source; no build-time overlay remains.')
          PY
      - name: Bundled redistribution license sources must be complete
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/assets/licenses
          for file in ORIGINAL_APP_LICENSE.txt THIRD_PARTY_NOTICES.md APACHE-2.0.txt GLIDE_LICENSE.txt; do
            test -s "$root/$file"
          done
          cmp -s LICENSE "$root/ORIGINAL_APP_LICENSE.txt"
          cmp -s THIRD_PARTY_NOTICES.md "$root/THIRD_PARTY_NOTICES.md"
          grep -Fq 'Copyright (c) 2020 Tommaso Berlose' "$root/ORIGINAL_APP_LICENSE.txt"
          grep -Fq 'Version 2.0, January 2004' "$root/APACHE-2.0.txt"
          grep -Fq 'Copyright 2014 Google, Inc. All rights reserved.' "$root/GLIDE_LICENSE.txt"
          grep -Fq 'Pinned upstream commit: `3e00f876906019ac224e29159ff1a777c4a47d4b`' "$root/THIRD_PARTY_NOTICES.md"
          grep -Fq 'play-services-location:21.0.1' "$root/THIRD_PARTY_NOTICES.md"
          grep -Fq 'OkHttp Public Suffix List data' "$root/THIRD_PARTY_NOTICES.md"
          grep -Fq 'Mozilla Public License 2.0' "$root/THIRD_PARTY_NOTICES.md"
          echo "Deterministic redistribution license sources are present."

      - name: Dead locale-only resources must remain absent
        shell: bash
        run: |
          set -euo pipefail
          for retired in \
            action_open_provider \
            api_key_info_all_set \
            api_key_subtitle_1 \
            api_key_subtitle_2 \
            api_key_subtitle_3 \
            api_key_title_1 \
            api_key_title_2 \
            api_key_title_3 \
            next_alarm_warning; do
            if grep -R -n -F "name=\"$retired\"" app/src/main/res/values* --include='strings.xml'; then
              echo "ERROR: dead locale-only resource remains: $retired" >&2
              exit 1
            fi
          done
          echo "Dead locale-only resource warnings are eliminated."

      - name: Internal broadcast action namespace must follow applicationId
        shell: bash
        run: |
          set -euo pipefail
          actions=app/src/main/java/com/tommasoberlose/anotherwidget/global/Actions.kt
          manifest=app/src/main/AndroidManifest.xml
          grep -Fq 'private val actionPrefix = "${BuildConfig.APPLICATION_ID}.action."' "$actions"
          ! grep -Fq 'com.tommasoberlose.anotherwidget.action.' "$actions"
          ! grep -Fq 'com.tommasoberlose.anotherwidget.action.' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.GO_TO_NEXT_EVENT"' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.GO_TO_PREVIOUS_EVENT"' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.CALENDAR_UPDATE"' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.TIME_UPDATE"' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.WEATHER_UPDATE"' "$manifest"
          grep -Fq 'android:name="${applicationId}.action.OPEN_WEATHER_INTENT"' "$manifest"
          echo "Internal broadcast actions follow the eventual public application ID."

      - name: Public app name must have one locale-independent source
        shell: bash
        run: |
          set -euo pipefail
          default=app/src/main/res/values/strings.xml
          test "$(grep -c 'name="app_name"' "$default")" = "1"
          grep -Fq '<string name="app_name" translatable="false">Yet Another Widget</string>' "$default"
          if grep -R -n 'name="app_name"' app/src/main/res/values-* --include='strings.xml'; then
            echo "ERROR: locale-specific app_name would split final public identity" >&2
            exit 1
          fi
          echo "Public app label is controlled by one default non-translatable resource."

      - name: Q4 release identity must be frozen
        shell: bash
        run: |
          set -euo pipefail
          gradle=app/build.gradle
          strings=app/src/main/res/values/strings.xml
          grep -Fq 'namespace "com.ramybaheeg.yetanotherwidget"' "$gradle"
          grep -Fq 'applicationId "com.ramybaheeg.yetanotherwidget"' "$gradle"
          grep -Fq 'versionCode 1' "$gradle"
          grep -Fq 'versionName "1.0.0"' "$gradle"
          grep -Fq '<string name="app_name" translatable="false">Yet Another Widget</string>' "$strings"
          grep -Fq '<string name="settings_publisher_identity">Publisher: Ramy Baheeg</string>' "$strings"
          grep -Fq 'Yet Another Widget is an independent restoration based on the MIT-licensed Another Widget source by Tommaso Berlose.' "$strings"
          grep -Fq 'package com.ramybaheeg.yetanotherwidget' app/src/main/java/com/tommasoberlose/anotherwidget/AWApplication.kt
          grep -Fq 'package com.ramybaheeg.yetanotherwidget' app/src/androidTest/java/com/tommasoberlose/anotherwidget/ExampleInstrumentedTest.kt
          if grep -R -n -F 'com.tommasoberlose.anotherwidget' app/src/main/java/com/tommasoberlose/anotherwidget app/src/androidTest/java/com/tommasoberlose/anotherwidget app/src/main/res/layout app/src/main/res/navigation; then
            echo "ERROR: historical runtime/source namespace residue remains" >&2
            exit 1
          fi
          test -f brand/yet-another-widget-icon.svg
          grep -Fq '#2F5BFF' brand/yet-another-widget-icon.svg
          test -f app/src/main/res/drawable/ic_launcher_monochrome.xml
          test -f app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          echo "Q4 public name, package, namespace, version, publisher, provenance, and icon contracts are frozen."

      - name: Runtime QA harness must discover public app identity from APK
        shell: bash
        run: |
          set -euo pipefail
          helper=tools/q1_runtime_identity.sh
          for script in tools/q1_emulator_smoke.sh tools/q1_emulator_smoke_recover.sh tools/q1_pin_probe.sh; do
            bash -n "$script"
          done
          bash -n "$helper"
          ! grep -R -n -F 'PACKAGE="com.tommasoberlose.anotherwidget"' tools
          if grep -R -n -F 'com.tommasoberlose.anotherwidget' tools/q1_emulator_smoke_recover.sh tools/q1_pin_probe.sh; then
            echo "ERROR: exact-final runtime harness still targets the historical package namespace" >&2
            exit 1
          fi
          grep -Fq 'TEST_CLASS="com.ramybaheeg.yetanotherwidget.LauncherWidgetDragTest"' tools/q1_emulator_smoke_recover.sh
          grep -Fq 'CLASS="com.ramybaheeg.yetanotherwidget.PinWidgetRequestTest"' tools/q1_pin_probe.sh
          grep -Fq 'find "$ANDROID_HOME/build-tools"' "$helper"
          grep -Fq 'find "$ANDROID_SDK_ROOT/build-tools"' "$helper"
          grep -Fq 'dump badging "$apk"' "$helper"
          grep -Fq 'dump badging "$test_apk"' "$helper"
          grep -Fq 'YAW_PACKAGE=' "$helper"
          grep -Fq 'YAW_ACTIVITY_CLASS=' "$helper"
          grep -Fq 'YAW_APP_LABEL=' "$helper"
          grep -Fq 'YAW_TEST_PACKAGE=' "$helper"
          grep -Fq 'YAW_TEST_RUNNER_CLASS=' "$helper"
          grep -Fq 'yaw_read_app_identity "$APK"' tools/q1_emulator_smoke.sh
          grep -Fq 'APP_LABEL="$YAW_APP_LABEL"' tools/q1_emulator_smoke.sh
          grep -Fq 'yaw_read_app_identity "$APP_APK"' tools/q1_emulator_smoke_recover.sh
          grep -Fq 'yaw_read_test_identity "$TEST_APK"' tools/q1_emulator_smoke_recover.sh
          grep -Fq 'yaw_read_app_identity "$APP_APK"' tools/q1_pin_probe.sh
          grep -Fq 'yaw_read_test_identity "$TEST_APK"' tools/q1_pin_probe.sh
          echo "Runtime QA harness derives public package/activity/label/test runner identity from built APKs."

      - name: Q2 deterministic build
        shell: bash
        run: bash tools/q1_build.sh
      - name: Built APK must contain redistribution license bundle
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          root=app/src/main/assets/licenses
          for file in ORIGINAL_APP_LICENSE.txt THIRD_PARTY_NOTICES.md APACHE-2.0.txt GLIDE_LICENSE.txt; do
            packaged="assets/licenses/$file"
            unzip -Z1 "$apk" | grep -Fxq "$packaged"
            expected="$(sha256sum "$root/$file" | awk '{print $1}')"
            actual="$(unzip -p "$apk" "$packaged" | sha256sum | awk '{print $1}')"
            test "$expected" = "$actual"
          done
          echo "Exact redistribution license bundle is present in the built APK."

      - name: Unsigned release APK and AAB must compile
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'signingConfig|signingConfigs|storeFile|keyAlias|storePassword|keyPassword' app/build.gradle gradle.properties 2>/dev/null
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          test "$(basename "$apk")" = "app-release-unsigned.apk"
          test "$(basename "$aab")" = "app-release.aab"
          if apksigner verify "$apk" >/dev/null 2>&1; then
            echo "ERROR: release APK unexpectedly carries a signing identity" >&2
            exit 1
          fi
          echo "Unsigned release APK and Play-format AAB compile without repository signing material."

      - name: Release APK and AAB must preserve redistribution notices
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          root=app/src/main/assets/licenses
          for file in ORIGINAL_APP_LICENSE.txt THIRD_PARTY_NOTICES.md APACHE-2.0.txt GLIDE_LICENSE.txt; do
            expected="$(sha256sum "$root/$file" | awk '{print $1}')"

            apk_path="assets/licenses/$file"
            unzip -Z1 "$apk" | grep -Fxq "$apk_path"
            apk_hash="$(unzip -p "$apk" "$apk_path" | sha256sum | awk '{print $1}')"
            test "$expected" = "$apk_hash"

            aab_path="base/assets/licenses/$file"
            unzip -Z1 "$aab" | grep -Fxq "$aab_path"
            aab_hash="$(unzip -p "$aab" "$aab_path" | sha256sum | awk '{print $1}')"
            test "$expected" = "$aab_hash"
          done
          unzip -Z1 "$apk" | grep -Eq '(^|/)okhttp3/internal/publicsuffix/NOTICE$'
          unzip -Z1 "$apk" | grep -Eq '(^|/)okhttp3/internal/publicsuffix/publicsuffixes\.gz$'
          unzip -Z1 "$aab" | grep -Eq '(^|/)okhttp3/internal/publicsuffix/NOTICE$'
          unzip -Z1 "$aab" | grep -Eq '(^|/)okhttp3/internal/publicsuffix/publicsuffixes\.gz$'
          echo "Release APK/AAB preserve the deliberate license bundle and OkHttp PSL notice/data."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: q2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unsigned release evidence
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: q3-unsigned-release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn


  q5-runtime-core:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android 36 SDK and emulator
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Rebuild exact Q5 candidate
        shell: bash
        run: bash tools/q1_build.sh
      - name: API 36 exact-final runtime core
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/q5_runtime_core.sh
      - name: Upload Q5 runtime-core evidence
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: q5-runtime-core-evidence
          path: q1-evidence/**
          if-no-files-found: warn

name: Yet Another Widget Q2 MET Attribution Repair

on:
  push:
    branches:
      - q2-publication-hardening-api36

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'Q2: stage guarded MET attribution hardening'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-head MET attribution hardening
        shell: bash
        env:
          BASE_HEAD: 949669fa4fb29ed1ff093556fde2d2970bd4f102
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          unexpected="$(git diff --name-only "$BASE_HEAD" HEAD | grep -Ev '^(\.github/workflows/q2-build\.yml|tools/q2_met_attribution_hardening\.py)$' || true)"
          test -z "$unexpected"
          python tools/q2_met_attribution_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tommasoberlose/anotherwidget/helpers/WeatherHelper.kt app/src/main/res/values/strings.xml
          echo "Source-only MET attribution paths:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "Q2: harden MET provider attribution"
          git push origin HEAD:q2-publication-hardening-api36

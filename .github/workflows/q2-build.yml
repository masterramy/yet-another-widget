name: Yet Another Widget Q2 Location Repair

on:
  push:
    branches:
      - q2-publication-hardening-api36

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Q2: stage guarded location hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-head location hardening
        shell: bash
        env:
          BASE_HEAD: 3a5610879db84b556754ddc743bed0323ab9bcad
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          test "$(git diff --name-only "$BASE_HEAD" HEAD | sort)" = $'.github/workflows/q2-build.yml\ntools/q2_location_hardening.py'
          python tools/q2_location_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          echo "Source-only location hardening paths:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "Q2: harden modern location refresh path"
          git push origin HEAD:q2-publication-hardening-api36

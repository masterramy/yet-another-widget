name: Yet Another Widget Q2 Gson Security Repair

on:
  push:
    branches:
      - q2-publication-hardening-api36

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'Q2: stage guarded Gson security repair'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-parent Gson security hardening
        shell: bash
        env:
          BASE_HEAD: 0945b8604c482efc8d93fb89ad76fa80fdeddd27
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          unexpected="$(git diff --name-only "$BASE_HEAD" HEAD | grep -Ev '^(\.github/workflows/q2-build\.yml|tools/q2_gson_security_hardening\.py)$' || true)"
          test -z "$unexpected"
          python tools/q2_gson_security_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/tommasoberlose/anotherwidget/network/WeatherNetworkApi.kt
          echo "Source-only Gson hardening paths:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          grep -Fq "implementation 'com.google.code.gson:gson:2.14.0'" app/build.gradle
          ! grep -R -Fq 'com.google.gson.internal.LinkedTreeMap' app/src/main/java
          git commit -m "Q2: patch Gson CVE and decouple internal map"
          git push origin HEAD:q2-publication-hardening-api36

name: Yet Another Widget Q2 Build

on:
  push:
    branches:
      - q2-publication-hardening-api36
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Donation/Billing surface must be absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "com.android.billingclient\|com.android.vending.BILLING\|SupportDevActivity\|SupportDevViewModel" \
            app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/activities/settings/SupportDevActivity.kt
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/ui/viewmodels/settings/SupportDevViewModel.kt
          test ! -e app/src/main/res/layout/activity_support_dev.xml
          test ! -e app/src/main/res/layout/inapp_product_layout.xml
      - name: Google Fit and exact-polling surface must be retired
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "play-services-fitness\|play-services-auth" app/build.gradle
          ! grep -R "ACTIVITY_RECOGNITION\|com.google.android.apps.fitness\|ActivityDetectionReceiver" app/src/main app/build.gradle
          ! grep -R "com.google.android.gms.fitness\|FitnessOptions\|getHistoryClient" app/src/main/java
          test ! -e app/src/main/java/com/tommasoberlose/anotherwidget/receivers/ActivityDetectionReceiver.kt
      - name: Q2 deterministic build
        shell: bash
        run: bash tools/q1_build.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: q2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

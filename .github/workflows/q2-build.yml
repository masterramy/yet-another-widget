name: Yet Another Widget Q2 Build

on:
  push:
    branches:
      - q2-publication-hardening-api36
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Retired Billing must stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'com\.android\.billing|BillingClient|BillingResult|PurchasesUpdatedListener|querySkuDetailsAsync|launchBillingFlow|acknowledgePurchase|billing_permission' app/src/main app/build.gradle || { echo 'Retired Billing residue detected'; exit 1; }
      - name: Retired Google Fit and exact polling must stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'FitnessOptions|HistoryClient|DataReadRequest|DataType\.TYPE_STEP_COUNT_DELTA|GoogleSignIn|READ_WRITE|ACTION_REQUEST_SCHEDULE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|setExactAndAllowWhileIdle|setExact\(' app/src/main app/build.gradle || { echo 'Retired Fit/exact-polling residue detected'; exit 1; }
      - name: Historical network identity must stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'tommasoberlose\.com|anotherwidget\.tommasoberlose\.com|yet-another-widget' app/src/main app/build.gradle || { echo 'Historical network identity residue detected'; exit 1; }
      - name: Bundled Google Sans must stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! find app/src/main -type f -print0 | xargs -0 grep -IlE 'Google Sans|google_sans' | grep . || { echo 'Bundled Google Sans residue detected'; exit 1; }
      - name: Legacy location permission model must stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'ACCESS_BACKGROUND_LOCATION|requestPermissions\([^\n]*ACCESS_FINE_LOCATION|requestPermissions\([^\n]*ACCESS_COARSE_LOCATION' app/src/main || { echo 'Legacy location permission residue detected'; exit 1; }
      - name: Android application backup must stay disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo 'Android application backup is disabled.'
      - name: Gson security floor must stay enforced
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.google.code.gson:gson:2.8.9'" app/build.gradle
          ! grep -Fq "com.google.code.gson:gson:2.8.6" app/build.gradle
          echo "Gson is at the patched 2.8.9 floor."
      - name: OkHttp logging interceptor security floor must stay enforced
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'" app/build.gradle
          ! grep -Fq "com.squareup.okhttp3:logging-interceptor:4.9.0" app/build.gradle
          echo "OkHttp logging interceptor is at the patched 4.9.2 floor."
      - name: Widget PendingIntent compatibility must be durable source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/q1_widget_compat.py
          ! grep -Fq 'q1_widget_compat.py' tools/q1_build.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/StandardWidget.kt'),
              Path('app/src/main/java/com/tommasoberlose/anotherwidget/ui/widgets/AlignedWidget.kt'),
          ]
          refresh = re.compile(
              r'val\s+refreshIntent\s*=\s*PendingIntent\.getBroadcast\s*\(\s*'
              r'context\s*,\s*appWidgetId\s*,\s*'
              r'IntentHelper\.getWidgetUpdateIntent\s*\(\s*context\s*\)\s*,',
              re.MULTILINE,
          )
          for path in files:
              text = path.read_text()
              bad = re.findall(r'PendingIntent\.FLAG_UPDATE_CURRENT(?!\s+or\s+PendingIntent\.FLAG_IMMUTABLE)', text)
              if bad:
                  raise SystemExit(f'{path}: raw FLAG_UPDATE_CURRENT remains without FLAG_IMMUTABLE')
              if 'PendingIntent.getBroadcast(context, widgetID, i, 0)' in text:
                  raise SystemExit(f'{path}: legacy mutable weather token remains')
              if re.search(r'val\s+refreshIntent\s*=\s*PendingIntent\.getActivity\s*\(', text):
                  raise SystemExit(f'{path}: widget refresh still uses Activity PendingIntent')
              if len(refresh.findall(text)) != 1:
                  raise SystemExit(f'{path}: expected exactly one broadcast widget refresh token')
          print('Widget PendingIntent compatibility is durable shipping source; no build-time overlay remains.')
          PY
      - name: Q2 deterministic build
        shell: bash
        run: bash tools/q1_build.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: q2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

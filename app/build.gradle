apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.tommasoberlose.anotherwidget"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.tommasoberlose.anotherwidget"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 139
        versionName "2.3.3-q1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        renderscriptSupportModeEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
        renderScript = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Q1 compatibility bridge: keep the modern compiler/toolchain while exposing the
        // Kotlin 2.0 stdlib API surface. Deprecated case-conversion calls are migrated in Q2.
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // UI — mostly historical versions during Q1 so feasibility failures stay attributable.
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.browser:browser:1.3.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.kyleduo.switchbutton:library:2.1.0'
    // SlimAdapter is injected as pinned public MIT source by tools/q1_build.sh during Q1.

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.greenrobot:eventbus:3.2.0'

    // Event cache. Realm Gradle plugin is intentionally removed.
    implementation 'androidx.room:room-runtime:2.8.5'
    kapt 'androidx.room:room-compiler:2.8.5'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'net.danlew:android.joda:2.10.9'
    implementation 'com.github.warkiz:IndicatorSeekBar:v2.1.1'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    kapt 'com.github.bumptech.glide:compiler:4.11.0'

    // Q2 debt: Fit is EOL and must migrate to Health Connect or retire before freeze.
    implementation 'com.google.android.gms:play-services-fitness:20.0.0'
    implementation 'com.google.android.gms:play-services-auth:19.0.0'

    implementation 'com.github.KwabenBerko:OpenWeatherMap-Android-Library:2.0.2'
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // Q2 debt: historical donation-only billing path; remove for final paid-listing release.
    implementation 'com.android.billingclient:billing:3.0.3'
    implementation 'com.android.billingclient:billing-ktx:3.0.3'

    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.github.haroldadmin:NetworkResponseAdapter:4.0.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1'

    implementation 'com.chibatching.kotpref:kotpref:2.13.1'
    implementation 'com.chibatching.kotpref:livedata-support:2.13.1'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'com.karumi:dexter:6.2.1'

    // easy-content-providers was removed in Q1. Calendar access now uses CalendarContract.
    // Remote downloadable-font catalog intentionally disabled in Q1: it depended on a historical private Google API key.
}

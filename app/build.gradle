apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.ramybaheeg.yetanotherwidget"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.ramybaheeg.yetanotherwidget"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    // Q1 test-infrastructure modernization: current AndroidX Test releases provide
    // target-31+ compatible instrumentation manifests with explicit exported metadata.
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // UI — mostly historical versions during Q1 so feasibility failures stay attributable.
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.browser:browser:1.3.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.kyleduo.switchbutton:library:2.1.0'
    // SlimAdapter is vendored as pinned, compatibility-patched MIT source under app/src/main/java.

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.greenrobot:eventbus:3.2.0'

    // Event cache. Realm Gradle plugin is intentionally removed.
    implementation 'androidx.room:room-runtime:2.8.5'
    kapt 'androidx.room:room-compiler:2.8.5'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'net.danlew:android.joda:2.10.9'
    implementation 'com.github.warkiz:IndicatorSeekBar:v2.1.1'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // Keep Glide's annotation processor in lockstep with its runtime library.
    kapt 'com.github.bumptech.glide:compiler:4.12.0'

    // 21.0.1 clears the CVE-2022-2390 vulnerable play-services-basement floor
    // while preserving the FusedLocationProviderClient API used by the existing app.
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // 4.9.2 is the first patched release for CVE-2021-0341 and keeps this Q2 slice
    // impact-scoped to the existing OkHttp 4.9 line.
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'
    implementation 'com.github.haroldadmin:NetworkResponseAdapter:4.0.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1'

    implementation 'com.chibatching.kotpref:kotpref:2.13.1'
    implementation 'com.chibatching.kotpref:livedata-support:2.13.1'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'com.karumi:dexter:6.2.1'

    // easy-content-providers was removed in Q1. Calendar access now uses CalendarContract.
    // Remote downloadable-font catalog intentionally disabled in Q1: it depended on a historical private Google API key.
}
